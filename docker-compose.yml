services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: vacature-agent-api:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/vacature.db
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai-compat.model-serving.eu01.onstackit.cloud/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-6}
      CONFIDENCE_CANDIDATE: ${CONFIDENCE_CANDIDATE:-0.7}
      CONFIDENCE_REVIEW: ${CONFIDENCE_REVIEW:-0.4}
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: vacature-agent-web:latest
    ports:
      - "43218:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional Playwright sidecar for JS-heavy agent scans (not used by default adapters).
  # Enable with: docker compose --profile browser up -d
  browser:
    profiles: ["browser"]
    image: mcr.microsoft.com/playwright:v1.65.0-jammy
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  api-data:
